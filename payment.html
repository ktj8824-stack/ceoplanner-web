<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1B2D">
  <title>CEO플래너 · 구독 결제</title>
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="css/base.css">
  <style>
    body { background: var(--porcelain); }
    .pay { max-width: 560px; margin: 0 auto; padding: 24px 16px 60px; display: grid; gap: 16px; }
    .pay-head { display: flex; align-items: center; gap: 10px; }
    .pay-head a { color: var(--slate); font-size: 14px; text-decoration: none; }
    .pay-head h1 { font-size: 22px; margin: 0; flex: 1; }
    .now { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .now small { color: var(--slate); display: block; font-size: 13px; }
    .now b { font-size: 16px; }
    .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .plan { position: relative; text-align: left; padding: 16px; border: 2px solid var(--line); border-radius: 16px; background: #fff; cursor: pointer; display: grid; gap: 6px; font: inherit; color: inherit; }
    .plan[aria-checked="true"] { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(15, 27, 45, .08); }
    .plan .nm { font-weight: 800; font-size: 16px; }
    .plan .pr { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
    .plan .pr small { font-size: 13px; font-weight: 600; color: var(--slate); }
    .plan ul { margin: 4px 0 0; padding-left: 16px; font-size: 13px; color: var(--ink-2); display: grid; gap: 3px; }
    .plan .tag { position: absolute; top: -10px; right: 12px; background: var(--brass-ink); color: #fff; font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
    .execs { padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
    .execs .t { flex: 1; } .execs .t small { display: block; color: var(--slate); font-size: 12.5px; }
    .step { display: flex; align-items: center; gap: 8px; }
    .step button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 18px; font-weight: 700; cursor: pointer; }
    .step output { min-width: 28px; text-align: center; font-weight: 800; font-size: 17px; }
    .total { padding: 16px; display: grid; gap: 6px; }
    .total .row { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-2); }
    .total .vat { font-size: 12.5px; color: var(--slate); }
    .total .sum { font-size: 18px; font-weight: 800; color: var(--ink); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
    .note { font-size: 12.5px; color: var(--slate); line-height: 1.6; margin: 0; }
    .demo-note { background: #FFF6E5; color: var(--amber); border-radius: 12px; padding: 10px 14px; font-size: 13.5px; }
    #payment-method, #agreement { background: #fff; border-radius: 16px; overflow: hidden; }
    .err { color: var(--signal); font-size: 14px; margin: 0; }
    .err:empty { display: none; }
    .result { padding: 28px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; }
    .result .ic { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: #E7F3EC; color: var(--ok); }
    .result.bad .ic { background: #FBEAE6; color: var(--signal); }
    .result dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; text-align: left; margin: 8px 0; font-size: 14px; }
    .result dt { color: var(--slate); } .result dd { margin: 0; font-weight: 600; }
    .hist { padding: 14px 16px; }
    .hist h2 { font-size: 15px; margin: 0 0 8px; }
    .hist li { display: flex; justify-content: space-between; font-size: 13.5px; padding: 6px 0; border-top: 1px solid var(--line); }
    .hist ul { list-style: none; margin: 0; padding: 0; }
    .total .big { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
    .total .big b { font-size: 15px; } .total .big strong { font-size: 24px; letter-spacing: -.5px; color: var(--navy); }
    .box { border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.55; }
    .box.info { background: var(--brass-soft); color: var(--ink); }
    .box.warn { background: var(--signal-soft); color: var(--signal); font-weight: 600; }
    .pending { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-top: 8px; }
    .agree { display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; cursor: pointer; font-size: 14px; font-weight: 600; line-height: 1.5; }
    .agree input { width: 22px; height: 22px; flex-shrink: 0; accent-color: var(--navy); margin-top: 1px; }
    .agree small { display: block; color: var(--slate); font-weight: 500; font-size: 12.5px; }
    #payBtn { padding: 15px; font-size: 16px; font-weight: 800; border-radius: 14px; }
    .result .ord { font-family: ui-monospace, monospace; letter-spacing: .3px; }
    @media (max-width: 420px) { .plans { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="root" class="pay"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <script src="js/shared/config.js"></script>
  <script src="js/shared/utils.js"></script>
  <script src="js/shared/icons.js"></script>
  <script src="js/shared/demo.js"></script>
  <script src="js/shared/store.js"></script>
  <script src="js/shared/plan.js"></script>
  <script src="js/shared/login.js"></script>
  <script>
  /* 구독 결제 — 로드플래너 payment.html 과 같은 흐름
     1) 요금제 고르기 → 2) 서버가 주문 · 금액 확정(pay_prepare) → 3) 토스 결제창 → 4) 이 화면으로 돌아오면 서버 승인(pay_confirm)
     데모 모드에서는 결제창 없이 바로 반영돼요. */
  const Pay = {
    q: new URLSearchParams(location.search),
    plan: 'premium', execs: 0, widgets: null,

    get from() { return this.q.get('from') === 'web' ? 'web' : 'app'; },
    get backUrl() { return this.from === 'web' ? CEOP_CONFIG.SECRETARY_URL : CEOP_CONFIG.APP_URL; },
    get backLabel() { return this.from === 'web' ? '비서 웹으로' : '대표 앱으로'; },
    self(extra) { const u = new URL(location.href); u.search = ''; u.searchParams.set('from', this.from); for (const [k, v] of Object.entries(extra)) u.searchParams.set(k, v); return u.toString(); },

    async start() {
      const root = document.getElementById('root');
      try { await Store.init(this.from === 'web' ? 'secretary' : 'ceo'); }
      catch (e) { root.innerHTML = `<p class="err">연결 오류: ${U.esc(e.message || e)}</p>`; return; }
      if (Store.needsLogin) return Login.render(root, '결제하려면 로그인해 주세요', () => this.route());
      this.route();
    },

    route() {
      if (this.q.get('fail')) return this.showResult(false, this.q.get('message') || '결제를 취소했거나 완료하지 못했어요. 돈은 나가지 않았어요.');
      if (this.q.get('paymentKey')) return this.confirm();
      this.choose();
    },

    // ───────── 1) 요금제 고르기 ─────────
    choose() {
      const s = Plan.state(), P = Plan.PRICES, c = Store.company() || {};
      // 이용 중이면 지금 요금제 · 임원 수에서 시작 (그대로 두면 다음 달 미리 결제)
      if (s.plan === 'basic' || s.plan === 'premium') { this.plan = s.plan; this.execs = c.extraExecs || 0; }
      const card = (k, tag) => `<button type="button" class="plan" role="radio" data-plan="${k}" aria-checked="${this.plan === k}">
          ${tag ? `<span class="tag">${tag}</span>` : ''}
          <span class="nm">${Plan.NAMES[k]}</span>
          <span class="pr">${Plan.won(P[k])}<small> / 월 · VAT 별도</small></span>
          <ul>${Plan.FEATURES[k].map(f => `<li>${U.esc(f)}</li>`).join('')}</ul></button>`;
      const hist = Store.payments().filter(p => p.status === 'DONE').slice(0, 5);
      const pend = s.active && s.plan !== 'trial' && (c.nextPlan || c.nextExtraExecs != null)
        ? { plan: c.nextPlan || c.plan, execs: c.nextExtraExecs != null ? c.nextExtraExecs : (c.extraExecs || 0) } : null;
      const canPay = ['ceo', 'secretary'].includes(Store.role) || Store.mode === 'demo';
      document.getElementById('root').innerHTML = `
        <div class="pay-head"><a href="${U.esc(this.backUrl)}">← ${this.backLabel}</a></div>
        <div class="pay-head"><h1>구독 결제</h1></div>
        <div class="now card"><span><small>지금</small><b>${U.esc(Plan.summary())}</b>
          ${s.active && s.plan !== 'trial' ? `<small>다음 결제일 ${Plan.md(s.until)} · 매달 ${Plan.won(Plan.charge(c.plan, c.extraExecs || 0).total)}</small>` : ''}
          ${pend ? `<div class="pending"><span class="box info">${Plan.md(s.until)}부터 ${U.esc(Plan.NAMES[pend.plan])}${pend.execs ? ` + 임원 ${pend.execs}명` : ''} · 매달 ${Plan.won(Plan.charge(pend.plan, pend.execs).total)}으로 바뀌어요 (예약됨)</span>
            <button class="btn" type="button" id="cancelPend">예약 취소</button></div>` : ''}
          </span></div>
        <div class="plans" role="radiogroup" aria-label="요금제">${card('basic')}${card('premium', '추천')}</div>
        <div class="execs card"><span class="t"><b>추가 임원</b><small>대표님 외에 같은 회사 임원 1명당 월 ${Plan.won(P.perExec)}(VAT 별도) · 비서 · 기사 계정은 무료</small></span>
          <span class="step"><button type="button" data-ex="-1" aria-label="임원 줄이기">−</button><output id="exN">${this.execs}</output><button type="button" data-ex="1" aria-label="임원 늘리기">+</button></span></div>
        <div class="total card" id="total"></div>
        <div id="payArea">
          ${Store.mode === 'demo' ? '<p class="demo-note">데모 모드예요. 실제 결제창 없이 바로 반영돼요.</p>' : '<div id="payment-method"></div><div id="agreement"></div>'}
        </div>
        <label class="agree card" id="agreeRow"><input type="checkbox" id="agree"><span><span id="agreeT"></span><small id="agreeS"></small></span></label>
        <p class="err" id="payErr" role="alert"></p>
        <button class="btn primary" id="payBtn" type="button" ${canPay ? '' : 'disabled'}></button>
        <p class="note">· 카드로 결제하면 카드 매출전표가 세금 증빙이 돼요. 세금계산서가 꼭 필요하면 고객센터로 연락해 주세요.<br>
          · 이용 중에 늘리면 늘린 만큼만 다음 결제일까지 일할로 결제하고, 줄이면 다음 결제일부터 적용돼요.<br>
          · 언제든 해지할 수 있고, 해지해도 결제한 기간까지는 계속 쓸 수 있어요. · 금액은 서버에서 다시 확인해요.</p>
        ${hist.length ? `<div class="hist card"><h2>결제 내역</h2><ul>${hist.map(h => `<li><span>${Plan.untilText(h.approvedAt)} · ${Plan.NAMES[h.plan]}${h.extraExecs ? ` + 임원 ${h.extraExecs}` : ''}${h.kind === 'prorate' ? ' (일할)' : ''}<br><small class="muted">${U.esc(h.orderId || '')}</small></span><b>${Plan.won(h.amount)}</b></li>`).join('')}</ul></div>` : ''}`;
      const root = document.getElementById('root');
      root.querySelectorAll('[data-plan]').forEach(b => b.addEventListener('click', () => { this.plan = b.dataset.plan; root.querySelectorAll('[data-plan]').forEach(x => x.setAttribute('aria-checked', x === b)); this.update(); }));
      root.querySelectorAll('[data-ex]').forEach(b => b.addEventListener('click', () => { this.execs = Math.min(P.maxExec, Math.max(0, this.execs + Number(b.dataset.ex))); root.querySelector('#exN').textContent = this.execs; this.update(); }));
      root.querySelector('#payBtn').addEventListener('click', () => this.pay());
      root.querySelector('#agree').addEventListener('change', () => this.syncBtn());
      root.querySelector('#cancelPend')?.addEventListener('click', () => this.schedule(c.plan, c.extraExecs || 0, true));
      this.update();
      if (Store.mode === 'supabase') this.initToss();
    },
    quote() { return Plan.quote(Store.company(), this.plan, this.execs); },
    /** 이용 중에 지금과 같은 요금제를 고른 경우 (= 다음 달 미리 결제) */
    renew(q) { const s = Plan.state(); return q.kind === 'month' && s.active && s.plan !== 'trial'; },
    amount() { return this.quote().amount; },
    update() {
      const P = Plan.PRICES, q = this.quote(), m = q.monthly, w = Plan.won;
      this.q_ = q;
      const day = q.nextBillAt ? new Date(q.nextBillAt).getDate() : new Date().getDate();
      let html;
      if (q.kind === 'prorate') {
        const c = Store.company();
        const what = [this.plan !== c.plan ? `${Plan.NAMES[c.plan]} → ${Plan.NAMES[this.plan]}` : '', this.execs > (c.extraExecs || 0) ? `임원 ${this.execs - (c.extraExecs || 0)}명 추가` : ''].filter(Boolean).join(' · ');
        html = `<div class="row"><span>바꾸는 내용</span><span>${U.esc(what)}</span></div>
          <div class="row"><span>다음 결제일(${Plan.md(q.nextBillAt)})까지</span><span>${q.daysLeft}일 / ${q.cycleDays}일 일할</span></div>
          <div class="row"><span>공급가</span><span>${w(q.supply)}</span></div>
          <div class="row"><span>부가세 (10%)</span><span>${w(q.vat)}</span></div>
          <div class="big"><b>오늘 결제 금액</b><strong>${w(q.amount)}</strong></div>
          <div class="box info">${Plan.md(q.nextBillAt)}부터는 ${U.esc(Plan.NAMES[this.plan])}${this.execs ? ` + 임원 ${this.execs}명` : ''} · <b>매달 ${w(m.amount)}</b>(부가세 포함) 자동결제돼요. 결제일은 그대로예요.</div>`;
      } else if (q.kind === 'reduce') {
        html = `<div class="row"><span>${U.esc(Plan.NAMES[this.plan])}${this.execs ? ` + 임원 ${this.execs}명` : ''}</span><span>${w(m.supply)}</span></div>
          <div class="row"><span>부가세 (10%)</span><span>${w(m.vat)}</span></div>
          <div class="big"><b>다음 결제일부터 매달</b><strong>${w(m.amount)}</strong></div>
          <div class="box info"><b>오늘 결제는 없어요.</b> ${Plan.md(q.nextBillAt)}까지는 지금 요금제를 그대로 쓰고, ${Plan.md(q.nextBillAt)}부터 바뀌어요.</div>`;
      } else if (q.kind === 'mixed') {
        html = `<div class="box warn">늘리기와 줄이기는 한 번에 하나씩 해 주세요. 예: 임원을 먼저 줄이기 예약하고, 요금제는 따로 바꾸기</div>`;
      } else {
        html = `<div class="row"><span>${Plan.NAMES[this.plan]}</span><span>${w(P[this.plan])}</span></div>
          ${this.execs ? `<div class="row"><span>추가 임원 ${this.execs}명</span><span>${w(P.perExec * this.execs)}</span></div>` : ''}
          <div class="row vat"><span>공급가 ${w(q.supply)}</span><span>부가세 10% ${w(q.vat)}</span></div>
          <div class="big"><b>${this.renew(q) ? '다음 달 미리 결제' : '매달 결제 금액'}</b><strong>${w(q.amount)}</strong></div>
          ${this.renew(q) ? `<div class="box info">지금 요금제 그대로 다음 달(${Plan.md(Store.company().paidUntil)}~${Plan.md(q.nextBillAt)})을 미리 결제해요. 보통은 결제일에 자동으로 결제돼요.</div>` : ''}`;
      }
      document.getElementById('total').innerHTML = html;
      const paying = q.kind === 'month' || q.kind === 'prorate';
      document.getElementById('payArea').style.display = paying ? '' : 'none';
      document.getElementById('agreeRow').style.display = paying ? '' : 'none';
      document.getElementById('agreeT').textContent = q.kind === 'prorate'
        ? `오늘 ${w(q.amount)}을 결제하고, ${Plan.md(q.nextBillAt)}부터 매달 ${w(m.amount)} 자동결제에 동의해요`
        : `매달 ${day}일 ${w(q.amount)} 자동결제에 동의해요`;
      document.getElementById('agreeS').textContent = '언제든 해지할 수 있고, 해지해도 결제한 기간까지는 계속 쓸 수 있어요.';
      this.syncBtn();
      if (this.widgets && paying) this.widgets.setAmount({ currency: 'KRW', value: q.amount }).catch(() => {});
    },
    syncBtn() {
      const q = this.q_ || this.quote(), btn = document.getElementById('payBtn'), w = Plan.won;
      if (btn.dataset.busy) return;
      const canPay = ['ceo', 'secretary'].includes(Store.role) || Store.mode === 'demo';
      if (q.kind === 'reduce') { btn.textContent = '다음 결제일부터 바꾸기 예약'; btn.disabled = !canPay; return; }
      if (q.kind === 'mixed') { btn.textContent = '결제하기'; btn.disabled = true; return; }
      btn.textContent = q.kind === 'prorate' ? `오늘 ${w(q.amount)} 결제하기` : this.renew(q) ? `다음 달 ${w(q.amount)} 미리 결제` : `월 ${w(q.amount)} 정기결제 시작`;
      btn.disabled = !canPay || !document.getElementById('agree').checked;
    },
    // 이용 중 줄이기 예약 / 예약 취소 (결제 없음)
    async schedule(plan, execs, cancel) {
      const err = document.getElementById('payErr'); err.textContent = '';
      try { await Store.billing('pay_schedule', { plan, extraExecs: execs }); this.choose(); }
      catch (e) { err.textContent = e.message || (cancel ? '예약을 취소하지 못했어요.' : '예약하지 못했어요.'); }
    },
    async initToss() {
      try {
        if (typeof TossPayments !== 'function') throw new Error('no sdk');
        const tp = TossPayments(CEOP_CONFIG.TOSS_CLIENT_KEY);
        this.widgets = tp.widgets({ customerKey: TossPayments.ANONYMOUS });
        await this.widgets.setAmount({ currency: 'KRW', value: this.amount() });
        await this.widgets.renderPaymentMethods({ selector: '#payment-method' });
        await this.widgets.renderAgreement({ selector: '#agreement' });
      } catch (e) {
        this.widgets = null;
        document.getElementById('payErr').textContent = '결제창을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.';
      }
    },

    // ───────── 2~3) 주문 만들고 결제창 ─────────
    async pay() {
      const q = this.quote();
      if (q.kind === 'reduce') return this.schedule(this.plan, this.execs);
      if (!document.getElementById('agree').checked) return;
      const btn = document.getElementById('payBtn'), err = document.getElementById('payErr');
      err.textContent = ''; btn.dataset.busy = '1'; btn.disabled = true; btn.textContent = '주문 만드는 중…';
      try {
        const order = await Store.billing('pay_prepare', { plan: this.plan, extraExecs: this.execs });
        if (Store.mode === 'demo') {
          const r = await Store.billing('pay_confirm', { orderId: order.orderId, amount: order.amount, plan: this.plan, extraExecs: this.execs });
          return this.showResult(true, r);
        }
        if (!this.widgets) throw new Error('결제창을 불러오지 못했어요. 새로고침해 주세요.');
        if (order.amount !== this.amount()) await this.widgets.setAmount({ currency: 'KRW', value: order.amount });
        btn.textContent = '결제창 여는 중…';
        await this.widgets.requestPayment({
          orderId: order.orderId, orderName: order.orderName,
          successUrl: this.self({}), failUrl: this.self({ fail: '1' }),
          customerName: (Store.data.profile && Store.data.profile.name) || undefined,
        });
      } catch (e) {
        if (e && e.code !== 'USER_CANCEL') err.textContent = e.message || '결제를 시작하지 못했어요.';
        delete btn.dataset.busy; this.update();
      }
    },
    // ───────── 4) 돌아와서 서버 승인 ─────────
    async confirm() {
      document.getElementById('root').innerHTML = '<div class="card result"><b>결제 확인 중…</b><p class="muted small">창을 닫지 말아 주세요.</p></div>';
      try {
        const r = await Store.billing('pay_confirm', { paymentKey: this.q.get('paymentKey'), orderId: this.q.get('orderId'), amount: Number(this.q.get('amount')) });
        if (r.status === 'WAITING_FOR_DEPOSIT') return this.showResult(true, r, true);
        this.showResult(r.status === 'DONE', r);
      } catch (e) { this.showResult(false, (e && e.message) || '결제 승인에 실패했어요. 돈은 나가지 않았어요.'); }
      history.replaceState(null, '', this.self({}));   // 새로고침해도 다시 승인하지 않게 주소 정리
    },

    showResult(ok, r, waiting) {
      const root = document.getElementById('root'), w = Plan.won;
      if (!ok) {
        const code = this.q.get('code');
        root.innerHTML = `<div class="card result bad"><span class="ic">${Icon.svg('alert', 28)}</span><h2 style="margin:0">결제가 안 됐어요</h2>
          <p class="muted" style="margin:0">돈은 빠져나가지 않았어요.</p>
          <div class="box warn" style="text-align:left; width:100%;">이유: ${U.esc(typeof r === 'string' ? r : '')}${code ? ` <small class="muted">(${U.esc(code)})</small>` : ''}</div>
          <a class="btn primary" href="${U.esc(this.self({}))}" style="width:100%;">다른 카드로 결제하기</a><a class="btn quiet" href="${U.esc(this.backUrl)}">${this.backLabel}</a></div>`;
        return;
      }
      const va = waiting && r.virtualAccount;
      const c = Store.company() || {};
      const prorate = r.kind === 'prorate';
      const next = r.periodEnd || c.paidUntil;
      const monthly = Plan.charge(r.plan || c.plan, r.extraExecs != null ? r.extraExecs : (c.extraExecs || 0)).total;
      root.innerHTML = `<div class="card result"><span class="ic">${Icon.svg('check', 28)}</span>
        <h2 style="margin:0">${waiting ? '입금을 기다리고 있어요' : prorate ? '변경이 적용됐어요' : '결제가 완료됐어요'}</h2>
        ${prorate ? '<p class="muted" style="margin:0">바뀐 요금제 · 임원은 지금부터 바로 쓸 수 있어요.</p>' : ''}
        <dl>
          <dt>주문번호</dt><dd class="ord">${U.esc(r.orderId || this.q.get('orderId') || '—')}</dd>
          <dt>요금제</dt><dd>${U.esc(Plan.NAMES[r.plan] || '')}${r.extraExecs ? ` + 임원 ${r.extraExecs}명` : ''}</dd>
          <dt>결제 금액</dt><dd>${w(r.amount || 0)} <small class="muted">(${prorate ? '일할 · ' : ''}부가세 ${w(r.vat != null ? r.vat : Math.round((r.amount || 0) / 11))} 포함)</small></dd>
          ${r.method ? `<dt>결제 수단</dt><dd>${U.esc(r.method)}</dd>` : ''}
          ${next && !waiting ? `<dt>다음 결제일</dt><dd>${Plan.md(next)}부터 매달 ${w(monthly)}</dd>` : ''}
          ${va ? `<dt>입금 계좌</dt><dd>${U.esc(va.bankCode || va.bank || '')} ${U.esc(va.accountNumber || '')}</dd><dt>입금 기한</dt><dd>${U.esc(new Date(va.dueDate).toLocaleString('ko-KR'))}</dd>` : ''}
          ${r.mode === 'test' ? '<dt>참고</dt><dd>테스트 결제라 실제 돈은 나가지 않았어요</dd>' : ''}
        </dl>
        <p class="box info" style="margin:0; text-align:left;">카드 매출전표가 세금 증빙이 돼요. 해지해도 결제한 기간까지는 계속 쓸 수 있어요.</p>
        <a class="btn primary" href="${U.esc(this.backUrl)}" style="width:100%;">${this.backLabel} 돌아가기</a></div>`;
    },
  };
  Pay.start();
  </script>
</body>
</html>
